image: maven:3-eclipse-temurin-17

variables:
  MAVEN_OPTS: >-
    -Dhttps.protocols=TLSv1.2
    -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
    -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN
    -Dorg.slf4j.simpleLogger.showDateTime=true
    -Djava.awt.headless=true

  MAVEN_CLI_OPTS: >-
    --batch-mode
    --show-version
    --fail-at-end
    -DinstallAtEnd=false
    -DdeployAtEnd=false


cache:
  paths:
    - .m2/repository

stages:
  - build
  - test
  - deploy

build:
  stage: build
  script:
    - ./mvnw $MAVEN_CLI_OPTS $MAVEN_OPTS compile

test:
  stage: test
  script:
    - ./mvnw $MAVEN_CLI_OPTS $MAVEN_OPTS verify

build-native:
  stage: deploy
  script:
    - ./mvnw $MAVEN_CLI_OPTS -Pnative spring-boot:build-image -DskipTests
  only:
    - main
