spring:
  datasource:
    # limits connections during testing to save performance
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
      idle-timeout: 10000
  profiles:
    # loads tests in dev profile.
    active: dev
  jpa:
    hibernate:
      # delete database on application startup during tests
      ddl-auto: validate
    # format SQL statements
    properties:
      hibernate:
        format_sql: true
        # show_sql: true # shows generated SQL statements in console

  # certificate setting to trust https during test for handle
  ssl:
    bundle:
      pem:
        handle:
          truststore:
            certificate: file:docker/apps/handle/certs/handle-dev.crt

# ensures that testcontainers reuses started containers
# (not sure if properties actually do something)
testcontainers:
  reuse:
    enable: true


gams:
  storage:
    rootPath: ${GAMS_FILES_ROOT_PATH:gams-test}
    webRootPath: ${GAMS_WEB_ROOT_PATH:gams-web-test}
  solr:
    auto-commit: true # this is necessary to directly reflect changes in solr during tests
    batch-size: 100
    commit-interval: 5
  services:
    handle:
      base-url: ${HANDLE_SERVER_URL:https://localhost:8000}
      prefix: ${HANDLE_PREFIX:99999}
      auth-handle: ${HANDLE_AUTH_HANDLE:99999/ADMIN}
      auth-index: ${HANDLE_AUTH_INDEX:300}
      secret-key-path: ${HANDLE_SECRET_KEY_PATH:docker/apps/handle/secrets/handle-admin.secret}
      admin-handle: ${HANDLE_ADMIN_HANDLE:99999/ADMIN}
      admin-index: ${HANDLE_ADMIN_INDEX:200}
      ssl-bundle: handle


########
# Logging
# (handled in different profiles)
logging:
  file:
    name: ${LOG_FILE:log/test.log}
  level:
    org.ddh.gamsapi: ${LOG_LEVEL:DEBUG}
    org.ddh.gamsapi.System.security: ${SECURITY_LOG_LEVEL:DEBUG}
    org.springframework.security: ${SECURITY_LOG_LEVEL:DEBUG}
  logback:
    # cleans log file on startup
    rollingpolicy:
      clean-history-on-start: true