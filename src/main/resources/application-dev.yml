# file based logging
logging:
  file:
      name: log/app.log

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/gams
    username: admin
    password: admin
  # shows hibernate sql statements in console
  jpa:
    # show-sql: true  # uncomment to show generated sql statements in logging
    properties:
      hibernate.format_sql: true

  ssl:
    bundle:
      pem:
        handle:
          truststore:
            certificate: file:docker/apps/handle/certs/handle-dev.crt


#####
# Custom properties for GAMS
#
gams:
  docker:
    # postgres
    relational-db: "localhost:5432"
    # from integration-api
    # TODO: problem - there is the gams core hardcoded
    baseSearchUrl: ${BASE_SEARCH_URL:http://localhost:8983}
    # TODO remove hardcoded gams database?
    triplestoreUrl: ${TRIPLESTORE_URL:http://localhost:3030/gams}
    # elasticsearch
    elasticsearchUrl: ${ELASTICSEARCH_URL:http://localhost:9200}
    # using local host in dev?
    qleverUrl: ${QLEVER_URL:http://localhost:7001}
  services:
    handle:
      base-url: ${HANDLE_SERVER_URL:https://localhost:8000}
      prefix: ${HANDLE_PREFIX:99999}
      auth-handle: ${HANDLE_AUTH_HANDLE:99999/ADMIN}
      auth-index: ${HANDLE_AUTH_INDEX:300}
      secret-key-path: ${HANDLE_SECRET_KEY_PATH:docker/apps/handle/secrets/handle-admin.secret}
      admin-handle: ${HANDLE_ADMIN_HANDLE:99999/ADMIN}
      admin-index: ${HANDLE_ADMIN_INDEX:200}
      ssl-bundle: handle
  cors:
    allowed-origin-patterns: ${GAMSAPI_ALLOWED_ORIGIN_PATTERNS:*}
