      <div>
        <form id="idSearchForm" class="form w-50">
          <div class="input-group mb-3">
            <button class="btn btn-outline-success" type="submit" id="button-addon1">Search</button>
            <input name="id" th:value="${searchId}" type="text" class="form-control" placeholder="ID substring">
            <input name="pageSize" th:value="${pageSize}" type="hidden" class="form-control">
            <input name="sortBy" th:value="${sortBy}" type="hidden" class="form-control">
            <!-- reset pageIndex for new search -->
            <input name="pageIndex" th:value="0" type="hidden" class="form-control">
          </div>
        </form>

      </div>
      <div class="webcirilo-box shadow-sm">
        <table class="table table-striped table-hover table-sm">
          <thead>
          <tr>
            <th scope="col">
              <a class="link-dark text-decoration-none" th:href="'/api/v1/projects/' + ${project.projectAbbr} + '/objects?id=' + ${searchId} + '&sortBy=id'">ID</a>
            </th>
            <th scope="col">
              <a class="link-dark text-decoration-none" th:href="'/api/v1/projects/' + ${project.projectAbbr} + '/objects?id=' + ${searchId} + '&sortBy=baseMetadata.title'">title</a>
            </th>
            <th scope="col">
              <a class="link-dark text-decoration-none" th:href="'/api/v1/projects/' + ${project.projectAbbr} + '/objects?id=' + ${searchId} + '&sortBy=created'">created</a>
            </th>
            <!--          <th scope="col">-->
            <!--            <a class="link-dark text-decoration-none" th:href="'/api/v1/projects/' + ${project.projectAbbr} + '/objects?id=' + ${searchId} + '&sortBy=baseMetadata.type'">dc:type</a>-->
            <!--          </th>-->
            <th scope="col">Delete</th>
            <th scope="col">Integrate</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="do : ${digitalObjects}">
            <td><a
                    style="color: black; font-weight: 600;"
                    class="text-decoration-none"
                    th:text="${do.id}"
                    th:href="'/api/v1/projects/' + ${project.projectAbbr} + '/objects/' + ${do.id}"
            ></a></td>
            <td><span th:if="${do.baseMetadata}" th:text="${do.baseMetadata.title}"></span></td>
            <td><span th:if="${do.baseMetadata}" th:text="${do.created}"></span></td>
            <!--          <td><span th:if="${do.baseMetadata}" th:text="${do.baseMetadata.type}"></span></td>-->
            <td><div>
              <!--<a th:href="${do.metaAddress}" target="_blank">Fedora6 profile</a> -->
              <form
                      onsubmit="return confirm('Are you sure you want to delete this digital object?');"
                      action="#"
                      th:action="@{'/api/v1/projects/' + ${project.projectAbbr} + '/objects/' + ${do.id}}"
                      method="delete"
                      th:method="DELETE"
                      class="d-inline"
              >
                <input type="submit" class="btn btn-outline-dark" value="Delete" />
              </form>
            </div></td>
            <td><div>
              <form
                      th:action="@{'/api/v1/integration/projects/' + ${project.projectAbbr} + '/objects/' + ${do.id}}"
                      method="POST"
              >
                <button type="submit" class="btn btn-outline-success d-block">Integrate</button>
              </form>

            </div></td>
          </tr>
          </tbody>
        </table>
        <p th:text="'Found digital objects: ' + ${totalItems}"></p>
        <div aria-label="Page navigation example">
          <ul class="pagination">
            <li class="page-item" th:classappend="${pageIndex == 0} ? 'disabled'">
              <a class="page-link link-dark" th:href="'/api/v1/projects/' + ${project.projectAbbr} + '/objects?pageIndex=' + ${pageIndex - 1} + '&pageSize=' + ${pageSize} + '&id=' + ${searchId} + '&sortBy=' + ${sortBy}" aria-label="Previous">
                <span aria-hidden="true">&laquo;</span>
                <span class="sr-only">Previous</span>
              </a>
            </li>
            <li class="page-item" th:if="${(totalPages > 1) and (pageIndex > 0)}">
              <a class="page-link link-dark" th:href="'/api/v1/projects/' + ${project.projectAbbr} + '/objects?pageIndex=0' + '&pageSize=' + ${pageSize}  + '&id=' + ${searchId} + '&sortBy=' + ${sortBy}">1</a>
            </li>
            <li class="page-item" th:if="${(totalPages > 2) and (pageIndex > 1)}">
              <a class="page-link link-success" th:href="'/api/v1/projects/' + ${project.projectAbbr} + '/objects?pageIndex=1' + '&pageSize=' + ${pageSize}  + '&id=' + ${searchId} + '&sortBy=' + ${sortBy}">2</a>
            </li>

            <li class="page-item" style="background:lightgreen">
              <a style="font-weight: 1000" class="page-link link-success text-decoration-underline" th:href="'/api/v1/projects/' + ${project.projectAbbr} + '/objects?pageIndex=' + ${pageIndex} + '&pageSize=' + ${pageSize}  + '&id=' + ${searchId} + '&sortBy=' + ${sortBy}" th:text="${pageIndex + 1}"></a>
            </li>

            <li th:if="${(totalPages > 3) and (pageIndex < totalPages-2)}" class="page-item">
              <a class="page-link link-dark" th:href="'/api/v1/projects/' + ${project.projectAbbr} + '/objects?pageIndex=' + ${totalPages - 2} + '&pageSize=' + ${pageSize}  + '&id=' + ${searchId} + '&sortBy=' + ${sortBy}" th:text="${totalPages - 1}"></a>
            </li>
            <li th:if="${(totalPages > 3) and (pageIndex < totalPages-1)}" class="page-item">
              <a class="page-link link-dark" th:href="'/api/v1/projects/' + ${project.projectAbbr} + '/objects?pageIndex=' + ${totalPages - 1} + '&pageSize=' + ${pageSize}  + '&id=' + ${searchId} + '&sortBy=' + ${sortBy}" th:text="${totalPages}"></a>
            </li>


            <li class="page-item" th:classappend="${pageIndex == (totalPages - 1)} ? 'disabled'">
              <a class="page-link link-dark" th:href="'/api/v1/projects/' + ${project.projectAbbr} + '/objects?pageIndex=' + ${pageIndex + 1} + '&pageSize=' + ${pageSize}  + '&id=' + ${searchId} + '&sortBy=' + ${sortBy}" aria-label="Next">
                <span aria-hidden="true">&raquo;</span>
                <span class="sr-only">Next</span>
              </a>
            </li>
          </ul>
        </div>

        <form id="pageSizeForm" class="form">
          <div class="form-group">
            <label for="pageSize">Page size:</label>
            <select onchange="document.querySelector('#pageSizeForm').submit()" form="pageSizeForm" name="pageSize" th:value="${pageSize}" class="form-control w-25"
                    id="pageSize">
              <option th:each="s : ${ {10, 50, 100, 1000, 10000} }" th:value="${s}" th:text="${s}" th:selected="${s == pageSize}"></option>
            </select>
          </div>
          <input name="id" th:value="${searchId}" type="hidden">
          <input name="pageIndex" th:value="${pageIndex}" type="hidden" class="form-control">
          <input name="sortBy" th:value="${sortBy}" type="hidden" class="form-control">
        </form>
        <br/>
        <form
                onsubmit="return confirm('Are you sure you want to delete all digital objects from the current project?');"
                action="#"
                th:action="@{'/api/v1/projects/' + ${project.projectAbbr} + '/objects'}"
                method="delete"
                th:method="DELETE"
                class="d-inline"
        >
          <!-- <input type="hidden" name="id" th:field="*{id}"/> -->
          <!-- <input type="hidden" name="dsid" th:value="${#strings.substringAfter(dstream.ldpResource.path,'/datastream/')}"/> -->
          <input type="submit" class="btn btn-outline-success d-inline" value="Delete all objects"/>
        </form>
      </div>
