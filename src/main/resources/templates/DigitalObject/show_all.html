              <!--          </th>-->

            </tr>

              <td><span th:text="${do.modified}"></span></td>
              <!--          <td><span th:if="${do.baseMetadata}" th:text="${do.baseMetadata.type}"></span></td>-->

  <!--                      method="delete"-->
  <!--                      th:method="DELETE"-->
  <!--                      class="d-inline"-->
  <!--              >-->
  <!--                <input type="submit" class="btn btn-outline-dark" value="Delete" />-->
  <!--              </form>-->
  <!--            </div></td>-->
  <!--            <td><div>-->
  <!--              <form-->
  <!--                      th:action="@{'/api/v1/integration/projects/' + ${project.projectAbbr} + '/objects/' + ${do.id}}"-->
  <!--                      method="POST"-->
  <!--              >-->
  <!--                <button type="submit" class="btn btn-outline-dark d-block">Integrate</button>-->
  <!--              </form>-->

  <!--            </div></td>-->
            </tr>
            </tbody>
          </table>
          <!-- Simple pagination that works -->
          <!-- ULTRA-SAFE MINIMAL FIX: This avoids all type casting issues -->
          <!-- ULTRA-SAFE MINIMAL FIX: This avoids all type casting issues -->
          <div th:if="${totalPages > 1}" class="d-flex justify-content-between align-items-center mt-4">

            <!-- Results Info - Simple approach -->
            <div class="text-muted">
              <span th:text="'Page ' + ${pageIndex + 1} + ' of ' + ${totalPages} + ' (' + ${totalItems} + ' total items)'"></span>
            </div>

            <!-- Enhanced Pagination Controls with Smart Page Numbers -->
            <nav aria-label="Page navigation">
              <ul class="pagination pagination-sm mb-0">

                <!-- First Page -->
                <li class="page-item" th:classappend="${pageIndex == 0} ? 'disabled'">
                  <a class="page-link"
                     th:href="${pageIndex == 0} ? '#' : '/api/v1/projects/' + ${project.projectAbbr} + '/objects?pageIndex=0&pageSize=' + ${pageSize} + '&id=' + ${searchId} + '&sortBy=' + ${sortBy}">
                    First
                  </a>
                </li>

                <!-- Previous Page -->
                <li class="page-item" th:classappend="${pageIndex == 0} ? 'disabled'">
                  <a class="page-link"
                     th:href="${pageIndex == 0} ? '#' : '/api/v1/projects/' + ${project.projectAbbr} + '/objects?pageIndex=' + ${pageIndex - 1} + '&pageSize=' + ${pageSize} + '&id=' + ${searchId} + '&sortBy=' + ${sortBy}">
                    Previous
                  </a>
                </li>

                <!-- Smart Page Numbers -->
                <th:block th:if="${totalPages <= 7}">
                  <!-- Show all pages if 7 or fewer -->
                  <th:block th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                    <li class="page-item" th:classappend="${i == pageIndex} ? 'active'">
                      <a class="page-link"
                         th:href="'/api/v1/projects/' + ${project.projectAbbr} + '/objects?pageIndex=' + ${i} + '&pageSize=' + ${pageSize} + '&id=' + ${searchId} + '&sortBy=' + ${sortBy}"
                         th:text="${i + 1}"></a>
                    </li>
                  </th:block>
                </th:block>

                <th:block th:if="${totalPages > 7}">
                  <!-- Show smart pagination for many pages -->

                  <!-- First 3 pages (1, 2, 3) -->
                  <th:block th:each="i : ${#numbers.sequence(0, 2)}">
                    <li class="page-item" th:classappend="${i == pageIndex} ? 'active'">
                      <a class="page-link"
                         th:href="'/api/v1/projects/' + ${project.projectAbbr} + '/objects?pageIndex=' + ${i} + '&pageSize=' + ${pageSize} + '&id=' + ${searchId} + '&sortBy=' + ${sortBy}"
                         th:text="${i + 1}"></a>
                    </li>
                  </th:block>

                  <!-- Ellipsis after first pages (only if current page is far from start) -->
                  <li th:if="${pageIndex > 4}" class="page-item disabled">
                    <span class="page-link">...</span>
                  </li>

                  <!-- Current page and neighbors (if not already shown) -->
                  <th:block th:if="${pageIndex > 3 and pageIndex < totalPages - 4}">
                    <th:block th:each="i : ${#numbers.sequence(pageIndex - 1, pageIndex + 1)}">
                      <li class="page-item" th:classappend="${i == pageIndex} ? 'active'">
                        <a class="page-link"
                           th:href="'/api/v1/projects/' + ${project.projectAbbr} + '/objects?pageIndex=' + ${i} + '&pageSize=' + ${pageSize} + '&id=' + ${searchId} + '&sortBy=' + ${sortBy}"
                           th:text="${i + 1}"></a>
                      </li>
                    </th:block>
                  </th:block>

                  <!-- Ellipsis before last pages (only if current page is far from end) -->
                  <li th:if="${pageIndex < totalPages - 5}" class="page-item disabled">
                    <span class="page-link">...</span>
                  </li>

                  <!-- Last 3 pages -->
                  <th:block th:each="i : ${#numbers.sequence(totalPages - 3, totalPages - 1)}">
                    <li class="page-item" th:classappend="${i == pageIndex} ? 'active'">
                      <a class="page-link"
                         th:href="'/api/v1/projects/' + ${project.projectAbbr} + '/objects?pageIndex=' + ${i} + '&pageSize=' + ${pageSize} + '&id=' + ${searchId} + '&sortBy=' + ${sortBy}"
                         th:text="${i + 1}"></a>
                    </li>
                  </th:block>

                </th:block>

                <!-- Next Page -->
                <li class="page-item" th:classappend="${pageIndex >= totalPages - 1} ? 'disabled'">
                  <a class="page-link"
                     th:href="${pageIndex >= totalPages - 1} ? '#' : '/api/v1/projects/' + ${project.projectAbbr} + '/objects?pageIndex=' + ${pageIndex + 1} + '&pageSize=' + ${pageSize} + '&id=' + ${searchId} + '&sortBy=' + ${sortBy}">
                    Next
                  </a>
                </li>

                <!-- Last Page -->
                <li class="page-item" th:classappend="${pageIndex >= totalPages - 1} ? 'disabled'">
                  <a class="page-link"
                     th:href="${pageIndex >= totalPages - 1} ? '#' : '/api/v1/projects/' + ${project.projectAbbr} + '/objects?pageIndex=' + ${totalPages - 1} + '&pageSize=' + ${pageSize} + '&id=' + ${searchId} + '&sortBy=' + ${sortBy}">
                    Last
                  </a>
                </li>

              </ul>
            </nav>

            <!-- Page Size Selector -->
            <div>
              <form method="GET" class="d-inline">
                <select name="pageSize" class="form-select form-select-sm d-inline" style="width: auto;" onchange="this.form.submit()">
                  <option value="10" th:selected="${pageSize == 10}">10 per page</option>
                  <option value="25" th:selected="${pageSize == 25}">25 per page</option>
                  <option value="50" th:selected="${pageSize == 50}">50 per page</option>
                  <option value="100" th:selected="${pageSize == 100}">100 per page</option>
                </select>
                <input type="hidden" name="pageIndex" value="0">
                <input type="hidden" name="id" th:value="${searchId}">
                <input type="hidden" name="sortBy" th:value="${sortBy}">
              </form>
            </div>

          </div>

          <br/>
        </div>
        </div>
      </div>
      </div>

    <footer th:replace="fragments/general.html :: footer"></footer>
  </div>
