<script th:inline="javascript">
    async function deleteAllProjectObjects() {
        const projectAbbr = /*[[${project.projectAbbr}]]*/ '';
        const csrfToken = /*[[${_csrf?.token}]]*/ '';
        const csrfHeader = /*[[${_csrf?.headerName}]]*/ '';

        if(!csrfToken || !csrfHeader){
            console.error("BackendError: Csrf token / header name not present on current page - but the backend should've returned it.")
            return;
        }

        const totalObjects = /*[[${totalItems}]]*/ 0;

        if (!confirm(`Delete ALL ${totalObjects} objects from project "${projectAbbr}"? This cannot be undone.`)) {
            return;
        }

        // Double confirmation for safety
        if (!confirm(`Are you SURE? This will permanently delete all digital objects and their datastreams.`)) {
            return;
        }

        console.log(`[DELETE-ALL] Starting deletion of all objects for project: ${projectAbbr}`);

        try {
            // 1. Fetch all object IDs (paginated)
            const allIds = await fetchAllObjectIds(projectAbbr);
            console.log(`[DELETE-ALL] Retrieved ${allIds.length} object IDs`);

            if (allIds.length === 0) {
                alert('No objects found to delete.');
                return;
            }

            // 2. Delete each object sequentially
            let successCount = 0;
            let failCount = 0;

            for (let i = 0; i < allIds.length; i++) {
                const objectId = allIds[i];
                try {
                    const response = await fetch(
                        `/api/v1/projects/${encodeURIComponent(projectAbbr)}/objects/${encodeURIComponent(objectId)}`,
                        {
                            method: 'DELETE',
                            headers: { [csrfHeader]: csrfToken },
                            credentials: 'include',
                            redirect: 'follow'
                        }
                    );

                    if (response.ok) {
                        successCount++;
                        console.log(`[DELETE-ALL] (${i + 1}/${allIds.length}) Deleted: ${objectId}`);
                    } else {
                        failCount++;
                        console.error(`[DELETE-ALL] (${i + 1}/${allIds.length}) Failed: ${objectId} — HTTP ${response.status}`);
                    }
                } catch (err) {
                    failCount++;
                    console.error(`[DELETE-ALL] (${i + 1}/${allIds.length}) Error deleting ${objectId}:`, err);
                }
            }

            // 3. Report results
            const message = `Deletion complete.\nSucceeded: ${successCount}\nFailed: ${failCount}\nTotal: ${allIds.length}`;
            console.log(`[DELETE-ALL] ${message}`);
            alert(message);

            // 4. Reload page to reflect changes
            window.location.reload();

        } catch (err) {
            console.error('[DELETE-ALL] Fatal error:', err);
            alert('Deletion failed: ' + err.message);
        }
    }

    async function fetchAllObjectIds(projectAbbr) {
        const PAGE_SIZE = 10000;
        const allIds = [];
        let pageIndex = 0;
        let hasMore = true;

        while (hasMore) {
            const url = `/api/v1/projects/${encodeURIComponent(projectAbbr)}/objects/ids`
                + `?pageIndex=${pageIndex}&pageSize=${PAGE_SIZE}`;

            console.log(`[DELETE-ALL] Fetching IDs page ${pageIndex}...`);

            const response = await fetch(url, {
                headers: { 'Accept': 'application/json' },
                credentials: 'include'
            });

            if (!response.ok) {
                throw new Error(`Failed to fetch object IDs: HTTP ${response.status}`);
            }

            const data = await response.json();
            const ids = data.results || [];
            allIds.push(...ids);

            console.log(`[DELETE-ALL] Page ${pageIndex}: fetched ${ids.length} IDs (total so far: ${allIds.length})`);

            hasMore = data.pagination && data.pagination.hasNext;
            pageIndex++;
        }

        return allIds;
    }
</script>

<script th:inline="javascript">
    async function handleIngestFolder(input) {
        const projectAbbr = /*[[${project.projectAbbr}]]*/ '';
        const csrfToken = /*[[${_csrf?.token}]]*/ '';
        const csrfHeader = /*[[${_csrf?.headerName}]]*/ '';

        if(!csrfToken || !csrfHeader){
            console.error("BackendError: Csrf token / header name not present on current page - but the backend should've returned it.")
            return;
        }

        const files = input.files;
        if (!files || files.length === 0) {
            return;
        }

        // Group files by subfolder (= object ID)
        const sipMap = buildSipMap(files);
        const objectIds = Object.keys(sipMap);

        if (objectIds.length === 0) {
            alert('No valid object folders found. Each subfolder name represents an object ID.');
            input.value = '';
            return;
        }

        const msg = `Found ${objectIds.length} object(s) to ingest:\n\n`
            + objectIds.join('\n')
            + `\n\nExisting objects will be deleted first. Continue?`;

        if (!confirm(msg)) {
            input.value = '';
            return;
        }

        console.log(`[INGEST] Starting ingest of ${objectIds.length} objects for project: ${projectAbbr}`);

        let successCount = 0;
        let failCount = 0;
        const errors = [];
        let skippedCount = 0;

        for (let i = 0; i < objectIds.length; i++) {
            const objectId = objectIds[i];
            const objectFiles = sipMap[objectId];
            const progress = `(${i + 1}/${objectIds.length})`;

            try {
                // Step 0: Check if ingest is needed by comparing modification dates
                const localLastModified = Math.max(...objectFiles.map(f => f.file.lastModified));
                const localDate = new Date(localLastModified);
                // RFC 1123 format as expected by If-Modified-Since header
                const ifModifiedSince = localDate.toUTCString();

                const headResponse = await fetch(
                    `/api/v1/projects/${projectAbbr}/objects/${objectId}/datastreams`,
                    {
                        method: 'HEAD',
                        headers: { 'If-Modified-Since': ifModifiedSince },
                        credentials: 'include'
                    }
                );

                let serverLastModified = headResponse.headers.get("Last-Modified");

                if (headResponse.status === 200) {
                    skippedCount++;
                    console.log(`[INGEST] ${progress} Skipped: ${objectId} Local object files are older than server files (local: ${ifModifiedSince}, server: ${serverLastModified})`);
                    continue;
                }

                if (headResponse.status === 404) {
                    console.log(`[INGEST] ${progress} New object: ${objectId}`);
                    // No delete needed, proceed directly to zip + ingest
                } else {
                    console.log(`[INGEST] ${progress} Modified, re-ingesting: ${objectId} Local object files are newer than server files (local: ${ifModifiedSince}, server: ${serverLastModified})`);
                }


                // Step 1: Delete existing object (ignore 404)
                console.log(`[INGEST] ${progress} Deleting existing object: ${objectId}`);
                let deleteResponse;
                try {
                    deleteResponse = await fetch(
                        `/api/v1/projects/${encodeURIComponent(projectAbbr)}/objects/${encodeURIComponent(objectId)}`,
                        {
                            method: 'DELETE',
                            headers: { [csrfHeader]: csrfToken },
                            credentials: 'include'
                        }
                    );
                } catch (e){

                }

                if (deleteResponse.ok) {
                    console.log(`[INGEST] ${progress} Deleted existing object: ${objectId}`);
                } else if (deleteResponse.status === 404) {
                    console.log(`[INGEST] ${progress} Object does not exist yet: ${objectId}`);
                } else {
                    console.warn(`[INGEST] ${progress} Delete returned HTTP ${deleteResponse.status} for: ${objectId}`);
                }

                // Step 2: Zip the folder
                console.log(`[INGEST] ${progress} Zipping ${objectFiles.length} files for: ${objectId}`);
                const zip = new JSZip();
                objectFiles.forEach(file => {
                    // Files go directly at zip root, no object ID prefix.
                    // This matches how the backend handles the zip
                    zip.file(file.relativePath, file.file);
                });

                const zipBlob = await zip.generateAsync({ type: 'blob' });
                console.log(`[INGEST] ${progress} Zip created: ${(zipBlob.size / 1024).toFixed(1)} KB`);

                // Step 3: POST to ingest endpoint
                const formData = new FormData();
                formData.append('subInfoPackZIP', zipBlob, objectId + '.zip');

                console.log(`[INGEST] ${progress} Uploading: ${objectId}`);
                const ingestResponse = await fetch(
                    `/api/v1/projects/${encodeURIComponent(projectAbbr)}/objects`,
                    {
                        method: 'POST',
                        body: formData,
                        headers: { [csrfHeader]: csrfToken },
                        credentials: 'include'
                    }
                );

                if (ingestResponse.ok) {
                    successCount++;
                    console.log(`[INGEST] ${progress} Successfully ingested: ${objectId}`);
                } else {
                    failCount++;
                    let reason = `HTTP ${ingestResponse.status}`;
                    try {
                        const errBody = await ingestResponse.json();
                        reason += ` — ${errBody.message || ''}`;
                    } catch (_) {}
                    errors.push(`${objectId}: ${reason}`);
                    console.error(`[INGEST] ${progress} Failed to ingest: ${objectId} — ${reason}`);
                }

            } catch (err) {
                failCount++;
                errors.push(`${objectId}: ${err.message}`);
                console.error(`[INGEST] ${progress} Error processing ${objectId}:`, err);
            }
        }

        // Report results
        let resultMsg = `Ingest complete.\nIngested: ${successCount}\nSkipped (unchanged): ${skippedCount}\nFailed: ${failCount}\nTotal: ${objectIds.length}`;;
        if (errors.length > 0) {
            resultMsg += '\n\nErrors:\n' + errors.slice(0, 10).join('\n');
            if (errors.length > 10) {
                resultMsg += `\n... and ${errors.length - 10} more (check console)`;
            }
        }
        console.log(`[INGEST] ${resultMsg}`);
        alert(resultMsg);

        // Reset file input and reload
        input.value = '';
        //window.location.reload();
    }

    /**
     * Groups files from a directory input by their immediate subfolder name (= object ID).
     *
     * Expected structure:
     *   selected-folder/
     *     object-id-1/
     *       file1.xml
     *       file2.json
     *     object-id-2/
     *       file1.xml
     *
     * Returns: { "object-id-1": [{file, relativePath}], "object-id-2": [...] }
     */
    function buildSipMap(files) {
        const sipMap = {};

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            const pathParts = file.webkitRelativePath.split('/');

            // pathParts[0] = selected root folder name (irrelevant)
            // pathParts[1] = object ID (subfolder name)
            // pathParts[2+] = file path within the object folder

            if (pathParts.length < 3) {
                // File directly in root folder — skip (not a valid SIP)
                console.warn(`[INGEST] Skipping root-level file: ${file.webkitRelativePath}`);
                continue;
            }

            const objectId = pathParts[1];
            // Path within the object folder (e.g., "data/file.xml" or just "file.xml")
            const relativePath = pathParts.slice(2).join('/');

            if (!sipMap[objectId]) {
                sipMap[objectId] = [];
            }

            sipMap[objectId].push({ file: file, relativePath: relativePath });
        }

        // Log summary
        Object.keys(sipMap).forEach(id => {
            console.log(`[INGEST] SIP "${id}": ${sipMap[id].length} files`);
        });

        return sipMap;
    }
</script>
