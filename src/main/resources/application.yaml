
## default connection pool
# spring.datasource.hikari.connectionTimeout=20000
# spring.datasource.hikari.maximumPoolSize=5

spring:
  datasource:
    url: jdbc:postgresql://relationalDB:5432/gams
    username: admin
    password: admin
  jpa:
    hibernate:
      # set to create if you want to drop existing data on app startup
      # value "none" would require to initialize a schema via SQL va extra file
      ddl-auto: update
      properties:
        hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
        hibernate.jdbc.lob.non_contextual_creation: true
  # oauth2 integration with keycloak
  # TODO needs to deactivated in dev profile!
  # TODO redo config parameters - let them be controlled via the docker-compose file?
  security:
    oauth2:
      client:
        registration:
          gams-realm:
            client-id: gams-client
            client-secret: MrrcrE7BHO1mkzi2Zl9aTrofrltmjtMT
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:18085/login/oauth2/code/gams-client"
            # provider: keycloak
            # client-name: GAMS
        provider:
          gams-realm:
            issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8182/realms/gams-realm}


  #####
  # Thymeleaf config
  # enables thymeleaf creation of hidden input fields for PUT and POST requests via html forms
  # https://stackoverflow.com/questions/38370011/thymeleaf-button-click-to-call-http-delete-method
  mvc:
    hiddenmethod:
      filter.enabled: "true"

  # solves a bug where the thymeleaf template is not created correctly
  # https://stackoverflow.com/questions/52982246/spring-thymeleaf-throws-cannot-create-a-session-after-the-response-has-been-com
  thymeleaf:
    servlet:
      produce-partial-output-while-processing: "false"

  # sets the limit for multi-part files send via requests
  servlet:
    multipart:
      max-file-size: 10GB
      max-request-size: 10GB


########
# Logging
# (handled in different profiles)
logging:
  file:
    name: ${LOG_FILE:log/app.log}
  level:
    org.zim.gamsapi: ${LOG_LEVEL:TRACE}
    org.springframework.security: ${SECURITY_LOG_LEVEL:ERROR}

server:
  error:
    # includes stacktrace on error ( devtools will include it in dev)
    include-stacktrace: always
  # Since Spring Boot 3.2, this is the new property to handle reverse proxy headers
  # Needed to consider reverse-proxy / api-gateway in front
  forward-headers-strategy: framework
  # sets application port https://www.baeldung.com/spring-boot-change-port
  port: 18085
  # sets the max size of a http form post for tomcat (additional to other config that sets the limit for spring)
  # https://stackoverflow.com/questions/33232849/increase-http-post-maxpostsize-in-spring-boot
  tomcat:
    max-http-form-post-size: 10000000000


#####
# Custom properties for GAMS
#
gams:
  docker:
    # postgres
    relational-db: "relationalDB:5432"
    baseSearchUrl: ${BASE_SEARCH_URL:http://baseSearch:8983/solr/gams}
    triplestoreUrl: ${TRIPLESTORE_URL:http://triplestore:3030/gams}

# swagger ui base path
springdoc:
  swagger-ui:
    path: "/api/v1/openapi"
    # config-url: ${SWAGGER_CONFIG_URL:http://localhost:18085/v3/api-docs/swagger-config}
  api-docs:
    path: "/api/v1/openapi"

