spring:
  datasource:
    url: jdbc:postgresql://relationalDB:5432/gams
    username: admin
    password: admin
  security:
    oauth2:
      client:
        registration:
          gams-client:
            # CLIENT-ID
            # using name of configured keycloak client
            # in property value AND key
            client-id: ${OAUTH2_CLIENT_ID:gams-client}
            # CLIENT_SECRET paste in set client secret from keycloak here
            client-secret: ${OAUTH2_CLIENT_SECRET:MrrcrE7BHO1mkzi2Zl9aTrofrltmjtMT}
            # SCOPE
            scope: openid, profile, roles
            # AUTHORIZATION GRANTTYPE
            # authorization flow of client
            # in case of spring + thymeleaf web client -> authorization-code!
            authorization-grant-type: authorization_code
            # REDIRECT URI
            # url which keycloak server will call when authentication was succesful
            # redirect uri is defined by spring security
            redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:8080/login/oauth2/code/gams-client}
            # ISSUER-URI
            # under open id configuration on current realm of keycloak
            # urls that are defined being part of our realm
            # according to oauth2 standard!
            # all other endpoints are constructed from issuer endpoint like where to get the actual token etc.
            # issuer-uri: http://localhost:8182/auth/realms/gams-auth-realm
        provider:
          gams-client:
            issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8182/realms/gams-realm}
            # provider: gams-client
            # authorization-uri: http://localhost:8182/o/oauth2/v2/auth


#####
# Custom properties for GAMS
#
gams:
  docker:
    # postgres
    relational-db: "relationalDB:5432"
    # fedora6
    repository-dns: "fcrepo:8080"
    #
    gateway-dns: "gateway:8080"
    #
    solr: "solr:8983"
    # fileserver
    apache: "apache:8080"
    # system triplestoree
    systemTriplestore: "localhost:3030"