# Desc: 'Dev' docker compose file for local development of the gams-api.
# Starts-up required external services for gams-api, needed for testing
# and development like fedora6 and its dependent database.
# author: Sebastian Stoff

version: "3.7"

networks:
  default:
    name: gams-api-dev

services:

  relationalDB:
    image: postgres:12.3
    container_name: relationalDB
    ports:
      - "5431:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=gams
    # volumes:
      # - local_pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4_container
    restart: always
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=SebastianStoff@gmx.at
      - PGADMIN_DEFAULT_PASSWORD=admin
#    volumes:
#      - ${PWD}/docker/apps/pgadmin:/var/lib/pgadmin

  keycloak:
    image: quay.io/keycloak/keycloak:18.0.0
    container_name: keycloak
    ports:
      - "8182:8182"
    # needed to import default keycloak setting
    volumes:
      - ${PWD}/docker/apps/keycloak/data/import:/opt/keycloak/data/import
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      # - KEYCLOAK_FRONTEND_URL=http://localhost:8087/auth
    # imports mounted realm.json on startup (as required from keycloak 18.x)
    command: start-dev --import-realm --http-port=8182

  fcrepo:
    image: docker.io/zimgraz/fcrepo-java:6.2.0.2-slim
    container_name: fcrepo
    ports:
      - "8082:8080"
    volumes:
      - ${PWD}/docker/apps/fedora/fcrepo-home:/fcrepo-home
    environment:
      - FCREPO_AUTH=${FCREPO_AUTH:-false}
      - FCREPO_METRICS=${FCREPO_METRICS:-false}
      - FCREPO_REBUILD=${FCREPO_REBUILD:-false}
      - FCREPO_STORAGE=${FCREPO_STORAGE:-ocfl-fs}
      - FCREPO_VERSIONING=${FCREPO_VERSIONING:-false}
    depends_on:
      - fedora_postgres

  fedora_postgres:
    image: postgres:12.3
    container_name: fedora_postgres
    ports: 
      - "5432:5432"
    environment:
      - POSTGRES_USER=fcrepo-user
      - POSTGRES_PASSWORD=fcrepo-pw
      - POSTGRES_DB=fcrepo

  activemq:
    image: zimgraz/activemq:5.15.9.1
    container_name: activemq
    ports:
      # - "61616:61616"
      - "4051:8161"
    environment:
      - ACTIVEMQ_CONF=/opt/activemq/conf
    volumes:
      - ./docker/apps/activemq/activemq/activemq.xml:/opt/activemq/conf/activemq.xml
      - ./docker/apps/activemq/activemq/log4j.properties:/opt/activemq/conf/log4j.properties


