# Desc: 'Dev' docker compose file for local development of the gams-api.
# Starts-up required external services for gams-api, needed for testing
# and development like fedora6 and its dependent database.
# author: Sebastian Stoff

version: "3.7"

networks:
  default:
    name: gams-api-dev

services:

  relationalDB:
    image: postgres:15.3
    container_name: relationalDB
    hostname: relationalDB
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=gams
      - PGDATA=/var/lib/postgresql/data/pgdata
    # optional: persist postgres data via volume
    # volumes:
      # needs additional wsl config to work if under wsl and bug occurs: https://stackoverflow.com/questions/65582382/wsl2-docker-linux-permission-issue-with-volumes
     # - ${PWD}/docker/apps/postgres/postgres-data:/var/lib/postgresql/data

  baseSearch:
    container_name: baseSearch
    hostname: baseSearch
    image: solr:9.2.1
    volumes:
      - ${PWD}/docker/apps/solr/solr/:/var/solr
    ports:
      - "8983"
      - "8983:8983"
    environment:
      - SOLR_HEAP=4g
    command:
      # - mkdir /var/solr
      # - bash -c "chown -R 8983:8983 /var/solr && runuser -u solr -- solr-precreate default-core"
      - solr-precreate
      - gams

  triplestore:
    container_name: triplestore
    hostname: triplestore
    image: stain/jena-fuseki:4.8.0
    ports:
      - "3030:3030"
    environment:
      - "FUSEKI_DATASET_1=gams"

  pgadmin:
    user: root
    image: dpage/pgadmin4:7.8
    container_name: pgadmin4_container
    restart: always
    ports:
      - "8888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: user-name@domain-name.com
      PGADMIN_DEFAULT_PASSWORD: strong-password
    volumes:
      - ${PWD}/docker/apps/pgadmin:/var/lib/pgadmin

  # TODO think about parameters controlled by docker compose, like issuer uri
  # TODO think about secrets workflow etc.
  # TODO think about production setup?
  keycloak:
    image: keycloak/keycloak:24.0.4-0
    container_name: keycloak
    ports:
      - "8182:8182"
    # needed to import default keycloak setting
    volumes:
      - ${PWD}/docker/apps/keycloak/data/import:/opt/keycloak/data/import
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      # - KEYCLOAK_FRONTEND_URL=http://localhost:8087/auth
    # imports mounted realm.json on startup (as required from keycloak 18.x)
    command: start-dev --import-realm --http-port=8182


