# Desc: 'Dev' docker compose file for local development of the gams-api.
# Starts-up required external services for gams-api, needed for testing
# and development like fedora6 and its dependent database.
# author: Sebastian Stoff

version: "3.7"

networks:
  default:
    name: gams-api-dev

services:

  relationalDB:
    image: postgres:15.3
    container_name: relationalDB
    hostname: relationalDB
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=gams
      - PGDATA=/var/lib/postgresql/data/pgdata
    # optional: persist postgres data via volume
    # volumes:
      # needs additional wsl config to work if under wsl and bug occurs: https://stackoverflow.com/questions/65582382/wsl2-docker-linux-permission-issue-with-volumes
     # - ${PWD}/docker/apps/postgres/postgres-data:/var/lib/postgresql/data


#  pgadmin:
#    image: dpage/pgadmin4
#    container_name: pgadmin4_container
#    hostname: pgadmin
#    restart: always
#    ports:
#      - "5050:80"
#    environment:
#      - PGADMIN_DEFAULT_EMAIL=SebastianStoff@gmx.at
#      - PGADMIN_DEFAULT_PASSWORD=admin
#    # volumes:
#    #   - ${PWD}/docker/apps/pgadmin:/var/lib/pgadmin

  keycloak:
    image: quay.io/keycloak/keycloak:18.0.0
    container_name: keycloak
    hostname: keycloak
    ports:
      - "8182:8182"
    # needed to import default keycloak setting
    volumes:
      - ${PWD}/docker/apps/keycloak/data/import:/opt/keycloak/data/import
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      # - KEYCLOAK_FRONTEND_URL=http://localhost:8087/auth
    # imports mounted realm.json on startup (as required from keycloak 18.x)
    command: start-dev --import-realm --http-port=8182


